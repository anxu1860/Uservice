[workspace]
members = ["crates/*", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/anxu1860/Uservice"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
